<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Private Dashboard 🔐</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(circle at 10% 20%, #ffdce9 0%, transparent 30%),
                radial-gradient(circle at 90% 80%, #ddd2ff 0%, transparent 30%),
                linear-gradient(135deg, #fff5f8, #f7f2ff);

            color: #392b40;
            padding: 25px;
        }

        .container {
            width: min(900px, 100%);
            margin: auto;
        }

        /* LOGIN */

        .login-card {
            max-width: 450px;
            margin: 12vh auto 0;

            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);

            padding: 35px;

            border-radius: 30px;

            box-shadow:
                0 25px 70px rgba(95, 61, 110, 0.15);

            text-align: center;
        }

        .lock {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #806d86;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;

            border-radius: 15px;

            border: 1px solid #e3d6e7;

            outline: none;

            font-size: 15px;

            margin-bottom: 12px;
        }

        input:focus {
            border-color: #a66bb5;

            box-shadow:
                0 0 0 4px rgba(166, 107, 181, 0.1);
        }

        button {
            border: none;

            cursor: pointer;

            padding: 13px 20px;

            border-radius: 14px;

            background:
                linear-gradient(135deg, #9563a9, #b477c5);

            color: white;

            font-weight: 700;

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            color: #c35a78;
            margin-top: 12px;
            font-size: 14px;
        }

        /* DASHBOARD */

        .dashboard {
            display: none;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;

            margin-bottom: 25px;
        }

        .topbar h1 {
            margin: 0;
        }

        .topbar p {
            color: #806d86;
            margin-top: 5px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .secondary {
            background: rgba(255, 255, 255, 0.8);
            color: #76547f;
            border: 1px solid #dfd0e3;
        }

        /* RESPONSE CARD */

        .response-card {
            background: rgba(255, 255, 255, 0.9);

            backdrop-filter: blur(20px);

            border-radius: 25px;

            padding: 28px;

            margin-bottom: 22px;

            box-shadow:
                0 15px 40px rgba(95, 61, 110, 0.1);
        }

        .person {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;

            padding-bottom: 20px;

            border-bottom: 1px solid #eee4f0;

            margin-bottom: 20px;
        }

        .name {
            font-size: 25px;
            font-weight: 700;
        }

        .date {
            color: #9a899f;
            font-size: 13px;
        }

        .question-block {
            margin-bottom: 20px;
        }

        .question-number {
            color: #9b6baa;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .question {
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .answer {
            background: #faf7fb;

            border-radius: 14px;

            padding: 15px;

            color: #625465;

            line-height: 1.6;

            white-space: pre-wrap;
        }

        .empty {
            text-align: center;

            background: rgba(255, 255, 255, 0.85);

            border-radius: 25px;

            padding: 50px 20px;

            color: #806d86;
        }

        .loading {
            text-align: center;
            color: #806d86;
            padding: 40px;
        }

        @media (max-width: 650px) {

            body {
                padding: 15px;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .actions {
                width: 100%;
            }

            .actions button {
                flex: 1;
            }

            .person {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>


<body>

<div class="container">


    <!-- ==========================================
         LOGIN
    =========================================== -->

    <section id="loginScreen">

        <div class="login-card">

            <div class="lock">
                🔐
            </div>

            <h1>
                Private Dashboard
            </h1>

            <p class="subtitle">
                This space is only for you.
                Sign in to see the responses.
            </p>


            <input
                type="email"
                id="email"
                placeholder="Your email"
                autocomplete="email"
            >


            <input
                type="password"
                id="password"
                placeholder="Your password"
                autocomplete="current-password"
            >


            <button
                id="loginButton"
                onclick="login()"
            >
                Login
            </button>


            <div
                id="loginError"
                class="error">
            </div>

        </div>

    </section>



    <!-- ==========================================
         DASHBOARD
    =========================================== -->

    <section
        id="dashboard"
        class="dashboard"
    >

        <div class="topbar">

            <div>

                <h1>
                    💌 Your Responses
                </h1>

                <p id="welcome">
                    Your private response dashboard
                </p>

            </div>


            <div class="actions">

                <button
                    class="secondary"
                    onclick="loadResponses()"
                >
                    ↻ Refresh
                </button>

                <button
                    onclick="logout()"
                >
                    Logout
                </button>

            </div>

        </div>


        <div id="responsesContainer">

            <div class="loading">
                Loading responses...
            </div>

        </div>

    </section>

</div>



<script>


/* =================================================
   SUPABASE CONFIGURATION

   USE THE SAME URL AND PUBLISHABLE KEY
   AS index.html
================================================= */


const SUPABASE_URL =
    "https://avbtorojlnzmmgtsivta.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_rh1kFdnwbxdmU6ovU7LAEA_LuBc68Q7";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =================================================
   LOGIN
================================================= */


async function login() {

    const email =
        document
            .getElementById("email")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value;


    const errorBox =
        document
            .getElementById("loginError");


    const button =
        document
            .getElementById("loginButton");


    errorBox.textContent = "";


    if (!email || !password) {

        errorBox.textContent =
            "Please enter your email and password.";

        return;

    }


    button.disabled = true;

    button.textContent =
        "Logging in...";


    const {
        data,
        error
    } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });


    if (error) {

        console.error(error);

        errorBox.textContent =
            error.message;

        button.disabled = false;

        button.textContent =
            "Login";

        return;

    }


    console.log(
        "Logged in:",
        data.user
    );


    showDashboard();

}



/* =================================================
   SHOW DASHBOARD
================================================= */


async function showDashboard() {

    document
        .getElementById("loginScreen")
        .style.display = "none";


    document
        .getElementById("dashboard")
        .style.display = "block";


    const user =
        (await supabaseClient.auth.getUser())
            .data
            .user;


    if (user) {

        document
            .getElementById("welcome")
            .textContent =
            `Logged in as ${user.email}`;

    }


    loadResponses();

}



/* =================================================
   LOAD RESPONSES
================================================= */


async function loadResponses() {

    const container =
        document
            .getElementById("responsesContainer");


    container.innerHTML =
        `<div class="loading">
            Loading responses...
        </div>`;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("responses")
            .select(`
                id,
                session_id,
                respondent_name,
                question_number,
                question,
                answer,
                created_at
            `)
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Dashboard error:",
            error
        );


        container.innerHTML =
            `<div class="empty">
                <h2>Couldn't load responses</h2>
                <p style="margin-top:10px;">
                    ${escapeHtml(error.message)}
                </p>
            </div>`;

        return;

    }


    if (!data || data.length === 0) {

        container.innerHTML =
            `<div class="empty">
                <h2>No responses yet 💌</h2>
                <p style="margin-top:10px;">
                    When someone submits the form,
                    their answers will appear here.
                </p>
            </div>`;

        return;

    }


    /*
       Group answers by session_id.

       This means all questions from
       one submission appear together.
    */


    const sessions = {};


    data.forEach(row => {

        if (!sessions[row.session_id]) {

            sessions[row.session_id] = {

                name:
                    row.respondent_name,

                created_at:
                    row.created_at,

                answers: []

            };

        }


        sessions[row.session_id]
            .answers
            .push(row);

    });


    const sessionList =
        Object.values(sessions);


    sessionList.forEach(session => {

        session.answers.sort(
            (a, b) =>
                a.question_number -
                b.question_number
        );

    });


    container.innerHTML =
        sessionList
            .map(createResponseCard)
            .join("");

}



/* =================================================
   CREATE RESPONSE CARD
================================================= */


function createResponseCard(session) {

    const date =
        new Date(
            session.created_at
        ).toLocaleString(
            undefined,
            {
                dateStyle: "medium",
                timeStyle: "short"
            }
        );


    const answers =
        session.answers
            .map(row => {

                return `
                    <div class="question-block">

                        <div class="question-number">
                            Question ${row.question_number}
                        </div>

                        <div class="question">
                            ${escapeHtml(row.question)}
                        </div>

                        <div class="answer">
                            ${escapeHtml(row.answer)}
                        </div>

                    </div>
                `;

            })
            .join("");


    return `
        <article class="response-card">

            <div class="person">

                <div class="name">
                    💗 ${escapeHtml(session.name)}
                </div>

                <div class="date">
                    ${escapeHtml(date)}
                </div>

            </div>

            ${answers}

        </article>
    `;

}



/* =================================================
   LOGOUT
================================================= */


async function logout() {

    await supabaseClient.auth.signOut();

    document
        .getElementById("dashboard")
        .style.display = "none";


    document
        .getElementById("loginScreen")
        .style.display = "block";


    document
        .getElementById("email")
        .value = "";


    document
        .getElementById("password")
        .value = "";

}



/* =================================================
   CHECK EXISTING LOGIN
================================================= */


async function checkSession() {

    const {
        data
    } =
        await supabaseClient.auth.getSession();


    if (
        data &&
        data.session
    ) {

        showDashboard();

    }

}



/* =================================================
   HTML ESCAPE
   Protects dashboard from HTML
   inside answers.
================================================= */


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}



/* =================================================
   START
================================================= */


checkSession();


</script>

</body>

</html>
